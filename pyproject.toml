[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "denovowest"
version = "0.1.2"
description = "A de novo mutation simulation framework"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Erwan Delage", email = "ed11@sanger.ac.uk" },
    { name = "Joanna Kaplanis"},
    { name = "Kaitlin Samocha" } ]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
	"pandas",
	"gffutils",
	"click",
	"pyyaml",
	"pysam",
	"joblib"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

license = { file = "LICENSE" }

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["denovowest*"]

[project.scripts]
denovowest = "denovowest.cli:main"

[tool.pytest.ini_options]
markers = [
    "unit: unit tests for core package internals",
    "smoke: end-to-end CLI tests that exercise the full command on small fixtures",
    "regression: output comparison tests against known-good reference files",
    "misc: tests for standalone scripts under misc/",
    "functional: broader workflow and integration tests",
]
